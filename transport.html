<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>交通票資訊 | 2026 冰島夢幻之旅</title>
  <meta name="description" content="2026 冰島行程機票、租車等交通票管理頁面。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .page-hero { background: linear-gradient(135deg,#0d1f35 0%,#1a3050 50%,#0d2530 100%); padding: 80px clamp(18px,5vw,78px) 48px; color:white; }
    .page-hero h1 { font-size:clamp(28px,5vw,52px); font-weight:900; margin:0 0 8px; }
    .page-hero p  { color:rgba(255,255,255,0.6); font-size:15px; margin:0; }
    .action-bar { display:flex; align-items:center; justify-content:space-between; padding:20px clamp(18px,5vw,78px) 0; gap:12px; flex-wrap:wrap; }
    .action-bar h2 { font-size:17px; font-weight:800; margin:0; }
    .timeline-section { padding:24px clamp(18px,5vw,78px) 60px; max-width:900px; }
    .timeline { position:relative; }
    .timeline::before { content:''; position:absolute; left:28px; top:0; bottom:0; width:2px; background:var(--line); }
    .timeline-item { display:flex; gap:20px; margin-bottom:28px; position:relative; }
    .timeline-icon { width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; color:white; flex-shrink:0; z-index:1; border:3px solid var(--bg); box-shadow:0 0 0 2px var(--line); }
    .icon-flight { background:linear-gradient(135deg,#1565c0,#42a5f5); }
    .icon-train  { background:linear-gradient(135deg,#6a1b9a,#ab47bc); }
    .icon-ship   { background:linear-gradient(135deg,#00838f,#26c6da); }
    .icon-car    { background:linear-gradient(135deg,#2e7d32,#66bb6a); }
    .boarding-pass { flex:1; background:var(--surface); border:1px solid var(--line); border-radius:18px; overflow:hidden; transition:box-shadow 0.2s; }
    .boarding-pass:hover { box-shadow:0 8px 32px rgba(0,0,0,0.08); }
    .bp-header { display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:2px dashed var(--line); gap:10px; flex-wrap:wrap; }
    .bp-route  { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .bp-city   { font-size:18px; font-weight:900; letter-spacing:-0.02em; }
    .bp-arrow  { color:var(--muted); font-size:14px; }
    .bp-carrier { font-size:12px; font-weight:700; color:var(--muted); }
    .bp-controls { display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
    .bp-order-btn { background:var(--line); border:none; border-radius:7px; width:28px; height:28px; cursor:pointer; font-size:12px; display:flex; align-items:center; justify-content:center; color:var(--muted); transition:background 0.15s,color 0.15s; }
    .bp-order-btn:hover { background:var(--accent); color:white; }
    .bp-body { display:grid; grid-template-columns:1fr 1fr 1fr; gap:0; border-bottom:1px solid var(--line); }
    .bp-col { padding:12px 16px; border-right:1px solid var(--line); }
    .bp-col:last-child { border-right:none; }
    .bp-col .col-label { font-size:10px; font-weight:800; letter-spacing:0.1em; color:var(--muted); display:block; margin-bottom:4px; text-transform:uppercase; }
    .bp-col .col-type  { font-size:15px; font-weight:800; display:flex; align-items:center; gap:7px; }
    .bp-col .col-dt    { font-size:14px; font-weight:700; line-height:1.4; }
    .bp-col .col-dt .dt-date { color:var(--muted); font-size:12px; font-weight:600; }
    .col-pending { color:var(--muted); font-style:italic; font-weight:400; font-size:13px; }
    .bp-footer { padding:8px 16px; font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
    .tp-edit-area { display:none; padding:16px 20px 20px; border-top:2px dashed var(--line); background:rgba(0,0,0,0.02); }
    .tp-edit-area.active { display:block; }
    .edit-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
    .edit-grid .full { grid-column:1/-1; }
    .edit-field label { font-size:10px; font-weight:800; letter-spacing:0.06em; color:var(--muted); display:block; margin-bottom:4px; text-transform:uppercase; }
    .edit-field input,.edit-field select,.edit-field textarea { width:100%; box-sizing:border-box; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font-size:13px; font-family:inherit; transition:border-color 0.15s; }
    .edit-field input:focus,.edit-field select:focus,.edit-field textarea:focus { outline:none; border-color:var(--accent); }
    .edit-field textarea { resize:vertical; min-height:52px; }
    .edit-actions-row { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; }
    .save-toast { position:fixed; bottom:24px; right:24px; background:#1a7a5a; color:white; padding:12px 20px; border-radius:12px; font-size:14px; font-weight:700; box-shadow:0 4px 20px rgba(0,0,0,0.2); transform:translateY(80px); opacity:0; transition:all 0.3s ease; z-index:999; }
    .save-toast.show { transform:translateY(0); opacity:1; }
    @media (max-width:600px) { .bp-body { grid-template-columns:1fr 1fr; } .edit-grid { grid-template-columns:1fr; } .edit-grid .full { grid-column:1; } }
    body.dark .icon-flight { background:linear-gradient(135deg,#0d47a1,#1976d2); }
    body.dark .icon-car    { background:linear-gradient(135deg,#1b5e20,#388e3c); }
    body.dark .tp-edit-area { background:rgba(255,255,255,0.03); }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="回到手冊首頁"><span class="brand-mark">◒</span><span>ICELAND · 2026</span></a>
    <nav class="nav">
      <a href="index.html#today">今日模式</a>
      <a href="index.html#days">每日行程</a>
      <a href="itinerary.html">簡易行程表</a>
      <a href="accommodation.html">🏠 住宿</a>
      <a href="transport.html" style="color:var(--accent);font-weight:800;">✈️ 交通票</a>
      <a href="shopping.html">🛋️ 伴手禮</a>
      <a href="checklist.html">✅ 清單</a>
    </nav>
    <div class="topbar-actions">
      <button id="themeBtn" class="icon-btn" aria-label="切換深色模式">☾</button>
      <button id="mobileMenuBtn" class="mobile-menu-btn" aria-label="開啟選單"><i class="fa-solid fa-bars"></i> <span>選單</span></button>
    </div>
  </header>
  <div id="mobileDrawer" class="mobile-drawer">
    <nav class="mobile-drawer-nav">
      <a href="index.html#today" class="drawer-link">⚡ 今日模式 <span>↗</span></a>
      <a href="index.html#days" class="drawer-link">📅 每日行程 <span>↗</span></a>
      <a href="itinerary.html" class="drawer-link">📋 簡易行程表 <span>↗</span></a>
      <a href="accommodation.html" class="drawer-link">🏠 住宿資訊 <span>↗</span></a>
      <a href="transport.html" class="drawer-link" style="color:var(--accent);">✈️ 交通票 <span>↗</span></a>
      <a href="shopping.html" class="drawer-link">🛋️ 伴手禮清單 <span>↗</span></a>
      <a href="checklist.html" class="drawer-link">✅ 準備清單 <span>↗</span></a>
    </nav>
  </div>
  <div class="save-toast" id="saveToast">✅ 交通資訊已儲存</div>
  <main>
    <div class="page-hero">
      <h1>✈️ 交通票資訊</h1>
      <p>機票 · 租車 · 接駁 · 渡輪 — 全程交通一覽</p>
    </div>
    <div class="action-bar">
      <h2>📋 交通行程列表</h2>
      <button class="btn primary" id="addTransportBtn" style="font-size:13px;padding:9px 18px;"><i class="fa-solid fa-plus"></i> 新增交通項目</button>
    </div>
    <div class="timeline-section">
      <div class="timeline" id="transport-timeline"></div>
    </div>
    <div style="padding:0 clamp(18px,5vw,78px) 60px;display:flex;gap:12px;flex-wrap:wrap;">
      <a href="index.html" class="btn secondary" style="font-size:13px;padding:10px 20px;"><i class="fa-solid fa-arrow-left" style="margin-right:6px;"></i> 回到完整手冊</a>
      <button class="btn secondary" onclick="window.print()" style="font-size:13px;padding:10px 20px;"><i class="fa-solid fa-print" style="margin-right:6px;"></i> 列印交通資訊</button>
    </div>
  </main>
  <footer>
    <span>ICELAND 2026 · 交通票資訊</span>
    <span>2026/09/23 出發 · 10/03 返回</span>
  </footer>
  <script>
    document.getElementById('themeBtn').onclick = () => { document.body.classList.toggle('dark'); document.getElementById('themeBtn').textContent = document.body.classList.contains('dark') ? '☀' : '☾'; };
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const mobileDrawer  = document.getElementById('mobileDrawer');
    mobileMenuBtn.onclick = () => { mobileDrawer.classList.toggle('active'); mobileMenuBtn.innerHTML = mobileDrawer.classList.contains('active') ? '<i class="fa-solid fa-xmark"></i> <span>關閉</span>' : '<i class="fa-solid fa-bars"></i> <span>選單</span>'; };

    const CATEGORY_MAP = {
      flight: { name:'飛機', icon:'fa-plane-departure', cls:'icon-flight' },
      train:  { name:'火車', icon:'fa-train',           cls:'icon-train'  },
      ship:   { name:'渡輪', icon:'fa-ship',            cls:'icon-ship'   },
      car:    { name:'租車', icon:'fa-car',             cls:'icon-car'    }
    };

    const BASE_TRANSPORTS = [
      { id:'tp-001', type:'flight', routeFrom:'TPE', routeTo:'KEF', startDate:'2026-09-23', depTime:'', endDate:'2026-09-23', arrTime:'15:25', flightNo:'待填', seat:'', booking:'', notes:'去程機票資訊（航班號、座位等待填入）' },
      { id:'tp-002', type:'car',    routeFrom:'凱夫拉維克機場 KEF', routeTo:'環島行程', startDate:'2026-09-23', depTime:'', endDate:'2026-10-02', arrTime:'', flightNo:'待填（車型）', seat:'', booking:'', notes:'包車司機聯絡資訊待確認後填入' },
      { id:'tp-003', type:'flight', routeFrom:'KEF', routeTo:'TPE', startDate:'2026-10-03', depTime:'07:40', endDate:'2026-10-03', arrTime:'', flightNo:'待填', seat:'', booking:'', notes:'07:40 清晨班機，建議前一晚確認接送時間' }
    ];

    const STORAGE_KEY = 'iceland_transport_v12';

    function loadTransports() {
      try { const r = localStorage.getItem(STORAGE_KEY); if (r) return JSON.parse(r); } catch(e) {}
      return JSON.parse(JSON.stringify(BASE_TRANSPORTS));
    }
    function saveTransports(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      const t = document.getElementById('saveToast'); t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000);
    }

    let transports = loadTransports();

    function renderTimeline() {
      const container = document.getElementById('transport-timeline');
      container.innerHTML = '';
      if (!transports.length) {
        container.innerHTML = '<div style="text-align:center;padding:48px 20px;color:var(--muted);"><i class="fa-solid fa-plane" style="font-size:36px;margin-bottom:12px;display:block;opacity:0.3;"></i><p style="margin:0;font-size:14px;">尚無交通資料，點擊上方「新增交通項目」開始！</p></div>';
        return;
      }
      transports.forEach((item, index) => {
        const cat = CATEGORY_MAP[item.type] || CATEGORY_MAP.flight;
        const isFirst = index === 0, isLast = index === transports.length - 1;
        const depHtml = (item.startDate || item.depTime)
          ? `<div class="col-dt"><div class="dt-date">${item.startDate||''}</div><div>${item.depTime||'—'}</div></div>`
          : `<div class="col-pending">待填</div>`;
        const arrHtml = (item.endDate || item.arrTime)
          ? `<div class="col-dt"><div class="dt-date">${item.endDate||''}</div><div>${item.arrTime||'—'}</div></div>`
          : `<div class="col-pending">待填</div>`;
        const notesHtml = item.notes ? `<div class="bp-footer"><i class="fa-solid fa-circle-info"></i> ${item.notes}</div>` : '';
        const flightBadge = item.flightNo ? `<span style="font-size:11px;color:var(--muted);font-weight:600;margin-left:4px;">${item.flightNo}</span>` : '';
        const el = document.createElement('div');
        el.className = 'timeline-item'; el.id = 'tp-item-' + item.id;
        el.innerHTML = `
          <div class="timeline-icon ${cat.cls}"><i class="fa-solid ${cat.icon}"></i></div>
          <div class="boarding-pass">
            <div class="bp-header">
              <div class="bp-route">
                <span class="bp-city">${item.routeFrom||'起站'}</span>
                <span class="bp-arrow"><i class="fa-solid fa-arrow-right"></i></span>
                <span class="bp-city">${item.routeTo||'終點'}</span>
              </div>
              <div class="bp-controls">
                <span class="bp-carrier">${cat.name}</span>
                ${!isFirst?`<button class="bp-order-btn" onclick="moveTransport(${index},-1)" title="向上移動"><i class="fa-solid fa-arrow-up"></i></button>`:''}
                ${!isLast ?`<button class="bp-order-btn" onclick="moveTransport(${index}, 1)" title="向下移動"><i class="fa-solid fa-arrow-down"></i></button>`:''}
                <button class="btn primary" style="font-size:12px;padding:5px 13px;" onclick="toggleEdit('${item.id}',true)"><i class="fa-solid fa-pen"></i> 編輯</button>
              </div>
            </div>
            <div class="bp-body">
              <div class="bp-col"><span class="col-label">車型 / 類別</span><div class="col-type"><i class="fa-solid ${cat.icon}" style="font-size:14px;"></i> ${cat.name}${flightBadge}</div></div>
              <div class="bp-col"><span class="col-label">出發</span>${depHtml}</div>
              <div class="bp-col"><span class="col-label">抵達</span>${arrHtml}</div>
            </div>
            ${notesHtml}
            <div class="tp-edit-area" id="edit-area-${item.id}">
              <div class="edit-grid">
                <div class="edit-field full"><label>類別</label><select id="ef-type-${item.id}"><option value="flight" ${item.type==='flight'?'selected':''}>✈️ 飛機</option><option value="train" ${item.type==='train'?'selected':''}>🚂 火車</option><option value="ship" ${item.type==='ship'?'selected':''}>🚢 渡輪</option><option value="car" ${item.type==='car'?'selected':''}>🚗 租車</option></select></div>
                <div class="edit-field full"><label>起站</label><input type="text" id="ef-from-${item.id}" value="${item.routeFrom||''}" placeholder="出發地點"></div>
                <div class="edit-field"><label>出發日期</label><input type="date" id="ef-startdate-${item.id}" value="${item.startDate||''}"></div>
                <div class="edit-field"><label>出發時間</label><input type="time" id="ef-deptime-${item.id}" value="${item.depTime||''}"></div>
                <div class="edit-field full"><label>目的站</label><input type="text" id="ef-to-${item.id}" value="${item.routeTo||''}" placeholder="抵達地點"></div>
                <div class="edit-field"><label>抵達日期</label><input type="date" id="ef-enddate-${item.id}" value="${item.endDate||''}"></div>
                <div class="edit-field"><label>抵達時間</label><input type="time" id="ef-arrtime-${item.id}" value="${item.arrTime||''}"></div>
                <div class="edit-field"><label>航班號 / 車型</label><input type="text" id="ef-flightno-${item.id}" value="${item.flightNo||''}" placeholder="CI 001 / Toyota RAV4"></div>
                <div class="edit-field"><label>座位 / 保險</label><input type="text" id="ef-seat-${item.id}" value="${item.seat||''}" placeholder="28A / 全險"></div>
                <div class="edit-field full"><label>訂單號</label><input type="text" id="ef-booking-${item.id}" value="${item.booking||''}" placeholder="訂位代號 / 訂單編號"></div>
                <div class="edit-field full"><label>備註</label><textarea id="ef-notes-${item.id}" placeholder="例如：需提前 2 小時到機場…">${item.notes||''}</textarea></div>
              </div>
              <div class="edit-actions-row">
                <div style="display:flex;gap:8px;">
                  <button class="btn primary" style="font-size:12px;padding:7px 16px;" onclick="saveEdit('${item.id}')"><i class="fa-solid fa-check"></i> 儲存</button>
                  <button class="btn secondary" style="font-size:12px;padding:7px 16px;" onclick="toggleEdit('${item.id}',false)">取消</button>
                </div>
                <button class="btn secondary" style="font-size:12px;padding:7px 16px;color:#e74c3c;border-color:#e74c3c;" onclick="deleteTransport('${item.id}')"><i class="fa-solid fa-trash"></i> 刪除此交通</button>
              </div>
            </div>
          </div>`;
        container.appendChild(el);
      });
    }

    function toggleEdit(id, show) { const a = document.getElementById('edit-area-'+id); if (a) a.classList.toggle('active', show); }

    function saveEdit(id) {
      const item = transports.find(x => x.id === id); if (!item) return;
      item.type      = document.getElementById('ef-type-'+id).value;
      item.routeFrom = document.getElementById('ef-from-'+id).value.trim();
      item.startDate = document.getElementById('ef-startdate-'+id).value;
      item.depTime   = document.getElementById('ef-deptime-'+id).value;
      item.routeTo   = document.getElementById('ef-to-'+id).value.trim();
      item.endDate   = document.getElementById('ef-enddate-'+id).value;
      item.arrTime   = document.getElementById('ef-arrtime-'+id).value;
      item.flightNo  = document.getElementById('ef-flightno-'+id).value.trim();
      item.seat      = document.getElementById('ef-seat-'+id).value.trim();
      item.booking   = document.getElementById('ef-booking-'+id).value.trim();
      item.notes     = document.getElementById('ef-notes-'+id).value.trim();
      saveTransports(transports); renderTimeline();
    }

    function deleteTransport(id) {
      if (!confirm('確定要刪除此筆交通行程嗎？')) return;
      transports = transports.filter(x => x.id !== id);
      saveTransports(transports); renderTimeline();
    }

    function addTransport() {
      const newId = 'tp-' + Date.now();
      transports.push({ id:newId, type:'flight', routeFrom:'', routeTo:'', startDate:'', depTime:'', endDate:'', arrTime:'', flightNo:'', seat:'', booking:'', notes:'' });
      saveTransports(transports); renderTimeline();
      toggleEdit(newId, true);
      const el = document.getElementById('tp-item-'+newId);
      if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
    }

    function moveTransport(index, dir) {
      const t = index + dir;
      if (t < 0 || t >= transports.length) return;
      [transports[index], transports[t]] = [transports[t], transports[index]];
      saveTransports(transports); renderTimeline();
    }

    document.getElementById('addTransportBtn').onclick = addTransport;
    renderTimeline();
  </script>
</body>
</html>
