<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>住宿資訊 | 2026 冰島夢幻之旅</title>
  <meta name="description" content="2026 冰島行程住宿管理頁，含三大住宿點位置、入住日期與訂房資訊。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="style.css" />

  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>
  <style>
    .page-hero {
      background: linear-gradient(135deg, #1a2f3a 0%, #2d4a5a 50%, #1a3a2a 100%);
      padding: 80px clamp(18px,5vw,78px) 48px;
      color: white;
    }
    .page-hero h1 { font-size: clamp(28px,5vw,52px); font-weight:900; margin:0 0 8px; }
    .page-hero p { color: rgba(255,255,255,0.65); font-size:15px; margin:0; }

    .hotel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px,1fr));
      gap: 24px;
      padding: 40px clamp(18px,5vw,78px);
    }

    .hotel-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .hotel-card:hover { box-shadow: 0 12px 40px rgba(0,0,0,0.1); transform: translateY(-2px); }

    .hotel-map-thumb { width:100%; height:160px; background:#e8f0f5; }
    .hotel-body { padding: 20px 22px 22px; }

    .hotel-city-tag {
      display: inline-block;
      background: rgba(224,123,32,0.12);
      color: #c05a10;
      border: 1px solid rgba(224,123,32,0.25);
      border-radius: 999px;
      padding: 3px 12px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    /* View mode */
    .hotel-view {}
    .hotel-name { font-size: 17px; font-weight: 800; margin: 0 0 4px; }
    .hotel-addr { font-size: 13px; color: var(--muted); margin: 0 0 14px; display:flex; align-items:flex-start; gap:6px; }

    .hotel-meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .hotel-meta-item .label { color: var(--muted); font-size: 10px; font-weight:700; letter-spacing:0.06em; display:block; margin-bottom:2px; }
    .hotel-meta-item .val { font-weight: 700; font-size: 14px; }

    .hotel-nights-section { margin-bottom: 14px; }
    .hotel-nights-section .label { color: var(--muted); font-size: 10px; font-weight:700; letter-spacing:0.06em; margin-bottom:6px; display:block; }
    .nights-tags { display:flex; flex-wrap:wrap; gap:6px; min-height: 26px; }
    .night-tag {
      background: var(--line);
      border-radius: 8px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 600;
    }
    .night-tag.pending { color: var(--muted); font-style: italic; font-weight: 400; }

    .hotel-booking-row { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
    .hotel-booking-row strong { color: var(--ink); }

    /* Edit form */
    .hotel-edit { display: none; }
    .hotel-edit.active { display: block; }
    .hotel-view.hidden { display: none; }

    .edit-form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .edit-form-grid .full { grid-column: 1 / -1; }
    .edit-field label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--muted);
      display: block;
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    .edit-field input, .edit-field textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      color: var(--ink);
      font-size: 13px;
      font-family: inherit;
      transition: border-color 0.15s;
    }
    .edit-field input:focus, .edit-field textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .edit-field textarea { resize: vertical; min-height: 60px; }

    /* Nights management in edit form */
    .nights-edit-wrap { margin-bottom: 12px; }
    .nights-edit-wrap .label { font-size: 10px; font-weight: 800; letter-spacing: 0.06em; color: var(--muted); display:block; margin-bottom:6px; text-transform: uppercase; }
    .nights-edit-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; min-height: 28px; }
    .night-edit-tag {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(224,123,32,0.1);
      border: 1px solid rgba(224,123,32,0.25);
      border-radius: 8px;
      padding: 3px 8px;
      font-size: 12px; font-weight: 600;
    }
    .night-edit-tag button {
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 12px; padding: 0; line-height: 1;
    }
    .night-edit-tag button:hover { color: #e03030; }
    .add-night-row { display: flex; gap: 6px; }
    .add-night-row input { flex:1; padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); font-size:13px; }
    .add-night-row button { padding:6px 12px; }

    /* Card action row */
    .hotel-actions { display:flex; gap:8px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }
    .edit-actions { display:flex; gap:8px; margin-top: 12px; }

    /* Save toast */
    .save-toast {
      position: fixed; bottom: 24px; right: 24px;
      background: #1a7a5a; color: white;
      padding: 12px 20px; border-radius: 12px;
      font-size: 14px; font-weight: 700;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      transform: translateY(80px); opacity: 0;
      transition: all 0.3s ease;
      z-index: 999;
    }
    .save-toast.show { transform: translateY(0); opacity: 1; }

    /* Map section */
    .map-section { padding: 0 clamp(18px,5vw,78px) 48px; }
    .map-section h2 { font-size: 20px; font-weight: 800; margin: 0 0 16px; }
    #accom-map { height: 380px; border-radius: 18px; border: 1px solid var(--line); }

    .info-bar {
      background: rgba(224,123,32,0.08);
      border: 1px solid rgba(224,123,32,0.2);
      border-radius: 12px;
      padding: 14px 20px;
      margin: 0 clamp(18px,5vw,78px) 32px;
      font-size: 13px; color: var(--ink);
      display: flex; align-items: center; gap: 10px;
    }

    body.dark .hotel-city-tag { background: rgba(224,123,32,0.2); color: #f0a060; }
    body.dark .night-tag { background: rgba(255,255,255,0.08); }
    body.dark .night-edit-tag { background: rgba(224,123,32,0.15); border-color: rgba(224,123,32,0.3); }
  </style>
</head>
<body>

    <nav class="nav">

      <a href="transport.html" class="drawer-link">✈️ 交通票 <span>↗</span></a>
      <a href="shopping.html" class="drawer-link">🛋️ 伴手禮清單 <span>↗</span></a>

    </nav>

  <!-- Save toast -->
  <div class="save-toast" id="saveToast">✅ 住宿資訊已儲存</div>

  <main>
    <div class="page-hero">
      <h1>🏠 住宿資訊</h1>
      <p>三大住宿地點 · 點擊「編輯」填入入住日期、訂單號等資訊</p>
    </div>

    <div class="info-bar">
      <i class="fa-solid fa-circle-info" style="color:#e07b20;flex-shrink:0;"></i>
      <span>點擊各住宿卡片的「✏️ 編輯」按鈕可填入入住日期、訂單號、電話等資訊，資料自動儲存在瀏覽器。</span>
    </div>

    <!-- Hotel Cards (rendered by JS) -->
    <div class="hotel-grid" id="hotel-grid"></div>

    <!-- Full Iceland Map -->
    <div class="map-section">
      <h2>🗺️ 住宿地點分布</h2>
      <div id="accom-map"></div>
    </div>

    <div style="padding: 0 clamp(18px,5vw,78px) 60px; display:flex; gap:12px; flex-wrap:wrap;">
      <a href="index.html" class="btn secondary" style="font-size:13px;padding:10px 20px;"><i class="fa-solid fa-arrow-left" style="margin-right:6px;"></i> 回到完整手冊</a>
      <button class="btn secondary" onclick="window.print()" style="font-size:13px;padding:10px 20px;"><i class="fa-solid fa-print" style="margin-right:6px;"></i> 列印住宿資訊</button>
    </div>
  </main>

  <footer>
    <span>ICELAND 2026 · 住宿資訊</span>
    <span>3 大住宿點 · 10 晚</span>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    // Theme & mobile menu
    document.getElementById('themeBtn').onclick = () => {
      document.body.classList.toggle('dark');
      document.getElementById('themeBtn').textContent = document.body.classList.contains('dark') ? '☀' : '☾';
    };
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const mobileDrawer = document.getElementById('mobileDrawer');
    mobileMenuBtn.onclick = () => {
      mobileDrawer.classList.toggle('active');
      mobileMenuBtn.innerHTML = mobileDrawer.classList.contains('active')
        ? '<i class="fa-solid fa-xmark"></i> <span>關閉</span>'
        : '<i class="fa-solid fa-bars"></i> <span>選單</span>';
    };

    // ── Hotel base data ─────────────────────────────────────────────
    const BASE_HOTELS = [
      {
        id: 'h-rvk',
        nameZh: '雷克雅維克公寓酒店 (Reykjavik Residence Hotel)',
        city: '雷克雅維克 Reykjavik',
        address: 'Skólavörðustígur 21A, 101 Reykjavík, Iceland',
        lat: 64.1458,
        lng: -21.9317,
        checkIn: '15:00',
        checkOut: '11:00',
        booking: '確認號：#RRH-20260923',
        phone: '+354 561 1155',
        website: 'https://www.rrhotel.is',
        notes: '位於雷克雅維克市中心，鄰近哈爾格林姆教堂與彩虹步道。附廚房設備與免費 Wi-Fi，方便自煮。',
        nights: ['2026-09-23', '2026-09-30', '2026-10-01', '2026-10-02']
      },
      {
        id: 'h-aku',
        nameZh: '基亞大飯店 (Hotel Kea by Keahotels)',
        city: '阿克雷里 Akureyri',
        address: 'Hafnarstræti 87-89, 600 Akureyri, Iceland',
        lat: 65.6811,
        lng: -18.0898,
        checkIn: '15:00',
        checkOut: '11:00',
        booking: '確認號：#KEA-20260925',
        phone: '+354 460 2000',
        website: 'https://www.keahotels.is/hotel-kea',
        notes: '北部阿克雷里核心地標飯店，緊鄰愛心紅綠燈與地標大教堂。周邊生活機能好，含每日早餐。',
        nights: ['2026-09-25', '2026-09-26', '2026-09-27']
      },
      {
        id: 'h-egs',
        nameZh: '埃伊爾斯塔德莊園民宿 (Guesthouse Egilsstaðir)',
        city: '埃伊爾斯塔德 Egilsstaðir',
        address: 'Egilsstaðanes, 700 Egilsstaðir, Iceland',
        lat: 65.2635,
        lng: -14.4075,
        checkIn: '15:00',
        checkOut: '11:00',
        booking: '確認號：#EGS-20260928',
        phone: '+354 471 1114',
        website: 'https://egilsstadir.is',
        notes: '東部狹長拉加爾湖畔（Lagarfljót）溫馨莊園民宿。遠離光害，極適合夜晚在湖畔花園等待極光。',
        nights: ['2026-09-28', '2026-09-29']
      }
    ];

    const META_KEY = 'iceland_hotels_data';       // hotel name/booking/phone/notes
    const TRIP_KEY = 'iceland_2026_trip_data';    // hotelId per day (shared with index.html)

    // ── Read trip days from shared key → derive nights per hotel ─────
    function getNightsFromTrip(hotelId) {
      try {
        const tripRaw = JSON.parse(localStorage.getItem(TRIP_KEY) || 'null');
        if (!tripRaw || !tripRaw.days) return [];
        return tripRaw.days
          .filter(d => d.hotelId === hotelId)
          .map(d => d.date)
          .sort();
      } catch(e) { return []; }
    }

    // ── Write hotelId back into shared trip data ───────────────────────
    function setDayHotelInTrip(date, hotelId) {
      try {
        const tripRaw = JSON.parse(localStorage.getItem(TRIP_KEY) || 'null');
        if (tripRaw && Array.isArray(tripRaw.days)) {
          const day = tripRaw.days.find(d => d.date === date);
          if (day) {
            day.hotelId = hotelId || null;
            localStorage.setItem(TRIP_KEY, JSON.stringify(tripRaw));
          }
        }
        return true;
      } catch(e) { console.warn('setDayHotelInTrip failed', e); return true; }
    }

    // ── Load merged hotel data ────────────────────────────────────────
    async function loadHotels() {
      try {
        let savedMeta = JSON.parse(localStorage.getItem(META_KEY) || '[]');
        if (window.db) {
          try {
            const doc = await db.collection('iceland_2026_shared').doc('hotels').get();
            if (doc.exists && doc.data().meta) {
              savedMeta = doc.data().meta;
              localStorage.setItem(META_KEY, JSON.stringify(savedMeta));
            }
          } catch(err) { console.log('Firestore load hotels error, using local fallback', err); }
        }
        return BASE_HOTELS.map(base => {
          const meta = savedMeta.find(x => x.id === base.id) || {};
          const tripNights = getNightsFromTrip(base.id);
          const metaNights = meta.nights || base.nights || [];
          const combinedNights = [...new Set([...tripNights, ...metaNights])].sort();
          return { ...base, ...meta, nights: combinedNights };
        });
      } catch(e) { return BASE_HOTELS.map(h => ({ ...h })); }
    }

    // ── Save metadata and nights ──────────────────────────────────────
    async function saveMeta(hotels) {
      const meta = hotels.map(({ id, nameZh, checkIn, checkOut, booking, phone, website, notes, nights }) =>
        ({ id, nameZh, checkIn, checkOut, booking, phone, website, notes, nights }));
      localStorage.setItem(META_KEY, JSON.stringify(meta));
      if (window.db) {
        try {
          await db.collection('iceland_2026_shared').doc('hotels').set({ meta, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        } catch(e) { console.warn('Firestore save hotels warning:', e); }
      }
      const toast = document.getElementById('saveToast');
      if (toast) {
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
      }
    }


    // ── Mini maps ─────────────────────────────────────────────────────
    const miniMaps = {};
    const miniMarkers = {};
    function initMiniMap(id, lat, lng) {
      const el = document.getElementById('map-' + id);
      if (!el || miniMaps[id]) return;
      const m = L.map(el, { zoomControl:false, dragging:false, scrollWheelZoom:false, attributionControl:false });
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(m);
      m.setView([lat, lng], 14);
      miniMarkers[id] = L.marker([lat, lng]).addTo(m);
      miniMaps[id] = m;
    }

    // ── Render ────────────────────────────────────────────────────────
    let hotels = loadHotels();

    function fmtNight(dateStr) {
      try {
        const d = new Date(dateStr);
        return d.toLocaleDateString('zh-TW', { month:'numeric', day:'numeric', weekday:'short' });
      } catch(e) { return dateStr; }
    }

    // ── Night add/remove (writes to trip data & hotel meta) ───────────
    function addNight(id) {
      const input = document.getElementById('night-input-' + id);
      const dateStr = input.value;
      if (!dateStr) { input.focus(); return; }

      const h = hotels.find(x => x.id === id);
      if (!h) return;
      if ((h.nights || []).includes(dateStr)) { alert('此日期已加入此住宿點'); return; }

      setDayHotelInTrip(dateStr, id);
      if (!h.nights) h.nights = [];
      h.nights.push(dateStr);
      h.nights.sort();
      saveMeta(hotels);
      input.value = '';
      refreshNightsList(id, h.nights);
    }

      input.value = '';
      refreshNightsList(id, h.nights);
    }

    function removeNight(id, dateStr) {
      const h = hotels.find(x => x.id === id);
      if (!h) return;
      setDayHotelInTrip(dateStr, null);   // clear hotelId in trip data
      h.nights = (h.nights || []).filter(n => n !== dateStr);
      refreshNightsList(id, h.nights);
      // Also update view-mode badges
      const viewNights = document.getElementById('nights-view-' + id);
      if (viewNights) {
        viewNights.innerHTML = h.nights.length
          ? h.nights.map(n => `<span class="night-tag">${fmtNight(n)}</span>`).join('')
          : '<span class="night-tag pending">待填入日期…</span>';
      }
    }

    function refreshNightsList(id, nights) {
      const list = document.getElementById('nights-edit-' + id);
      if (list) {
        list.innerHTML = nights.map(n =>
          `<span class="night-edit-tag">${fmtNight(n)}<button onclick="removeNight('${id}','${n}')" title="移除">×</button></span>`
        ).join('');
      }
    }

    function renderCards() {
      const grid = document.getElementById('hotel-grid');
      grid.innerHTML = '';
      hotels.forEach((h, idx) => {
        const card = document.createElement('div');
        card.className = 'hotel-card';
        card.id = 'hotel-card-' + h.id;

        const nightTagsHtml = h.nights && h.nights.length
          ? h.nights.map(n => `<span class="night-tag">${fmtNight(n)}</span>`).join('')
          : '<span class="night-tag pending">待填入日期…</span>';

        const bookingHtml = h.booking
          ? `<strong>訂單號：</strong>${h.booking}`
          : `<span style="color:var(--muted);">訂單號：待填</span>`;

        const nightEditTagsHtml = (h.nights || []).map(n =>
          `<span class="night-edit-tag">${fmtNight(n)}<button onclick="removeNight('${h.id}','${n}')" title="移除">×</button></span>`
        ).join('');

        card.innerHTML = `
          <div id="map-${h.id}" class="hotel-map-thumb"></div>
          <div class="hotel-body">
            <span class="hotel-city-tag">${h.city}</span>

            <!-- VIEW MODE -->
            <div class="hotel-view" id="view-${h.id}">
              <div class="hotel-name">${h.nameZh}</div>
              <div class="hotel-addr"><i class="fa-solid fa-location-dot" style="margin-top:2px;flex-shrink:0;color:var(--muted);"></i> ${h.address}</div>
              <div class="hotel-meta-grid">
                <div class="hotel-meta-item"><span class="label">CHECK-IN</span><span class="val">⬆️ ${h.checkIn}</span></div>
                <div class="hotel-meta-item"><span class="label">CHECK-OUT</span><span class="val">⬇️ ${h.checkOut}</span></div>
              </div>
              <div class="hotel-nights-section">
                <span class="label">📅 入住日期</span>
                <div class="nights-tags" id="nights-view-${h.id}">${nightTagsHtml}</div>
              </div>
              <div class="hotel-booking-row" id="booking-view-${h.id}">${bookingHtml}</div>
              ${h.phone ? `<div style="font-size:13px;color:var(--muted);margin-bottom:6px;"><i class="fa-solid fa-phone" style="margin-right:5px;"></i>${h.phone}</div>` : ''}
              ${h.notes ? `<div style="font-size:13px;color:var(--muted);margin-bottom:6px;font-style:italic;">${h.notes}</div>` : ''}
              <div class="hotel-actions">
                <button class="btn primary" style="font-size:13px;padding:8px 14px;" onclick="toggleEdit('${h.id}', true)"><i class="fa-solid fa-pen"></i> 編輯</button>
                <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(h.address)}" target="_blank" rel="noreferrer" class="btn secondary" style="font-size:13px;padding:8px 14px;"><i class="fa-solid fa-location-arrow"></i> 導航</a>
              </div>
            </div>

            <!-- EDIT MODE -->
            <div class="hotel-edit" id="edit-${h.id}">
              <div class="edit-form-grid">
                <div class="edit-field full">
                  <label>住宿名稱</label>
                  <input type="text" id="ef-name-${h.id}" value="${h.nameZh}" placeholder="住宿名稱">
                </div>
                <div class="edit-field">
                  <label>Check-In 時間</label>
                  <input type="text" id="ef-checkin-${h.id}" value="${h.checkIn}" placeholder="15:00">
                </div>
                <div class="edit-field">
                  <label>Check-Out 時間</label>
                  <input type="text" id="ef-checkout-${h.id}" value="${h.checkOut}" placeholder="11:00">
                </div>
                <div class="edit-field full">
                  <label>訂單號 / 訂房代號</label>
                  <input type="text" id="ef-booking-${h.id}" value="${h.booking}" placeholder="Booking.com #XXXXXX">
                </div>
                <div class="edit-field full">
                  <label>電話</label>
                  <input type="text" id="ef-phone-${h.id}" value="${h.phone}" placeholder="+354 XXX XXXX">
                </div>
                <div class="edit-field full">
                  <label>官網 / 訂房連結</label>
                  <input type="text" id="ef-website-${h.id}" value="${h.website}" placeholder="https://...">
                </div>
                <div class="edit-field full">
                  <label>備註</label>
                  <textarea id="ef-notes-${h.id}" placeholder="例如：附早餐、需要刷卡擔保...">${h.notes}</textarea>
                </div>
              </div>

              <div class="nights-edit-wrap">
                <span class="label">📅 入住日期（可多晚）</span>
                <div class="nights-edit-list" id="nights-edit-${h.id}">${nightEditTagsHtml}</div>
                <div class="add-night-row">
                  <input type="date" id="night-input-${h.id}">

                  <button class="btn primary" style="font-size:12px;padding:6px 12px;" onclick="addNight('${h.id}')"><i class="fa-solid fa-plus"></i> 加入</button>
                </div>
              </div>

              <div class="edit-actions">
                <button class="btn primary" onclick="saveEdit('${h.id}')"><i class="fa-solid fa-check"></i> 儲存</button>
                <button class="btn secondary" onclick="toggleEdit('${h.id}', false)">取消</button>
              </div>
            </div>

          </div>
        `;
        grid.appendChild(card);
        // Init mini map after DOM insert
        setTimeout(() => initMiniMap(h.id, h.lat, h.lng), 50);
      });
    }

    // ── Edit / save functions ─────────────────────────────────────────
    function toggleEdit(id, show) {
      document.getElementById('view-' + id).classList.toggle('hidden', show);
      document.getElementById('edit-' + id).classList.toggle('active', show);
    }

    function saveEdit(id) {
      const h = hotels.find(x => x.id === id);
      if (!h) return;
      h.nameZh   = document.getElementById('ef-name-' + id).value.trim() || h.nameZh;
      h.checkIn  = document.getElementById('ef-checkin-' + id).value.trim() || h.checkIn;
      h.checkOut = document.getElementById('ef-checkout-' + id).value.trim() || h.checkOut;
      h.booking  = document.getElementById('ef-booking-' + id).value.trim();
      h.phone    = document.getElementById('ef-phone-' + id).value.trim();
      h.website  = document.getElementById('ef-website-' + id).value.trim();
      h.notes    = document.getElementById('ef-notes-' + id).value.trim();
      // nights are updated live via addNight/removeNight → no extra save needed for nights
      saveMeta(hotels);       // save metadata only (not nights, those live in trip data)
      renderCards();          // full re-render to reflect new data
      toggleEdit(id, false);  // switch back to view mode
      setTimeout(() => initMiniMap(id, h.lat, h.lng), 60);
    }


    // ── Full Iceland map ───────────────────────────────────────────────
    function initFullMap() {
      const accomMap = L.map('accom-map', { zoomControl:true, attributionControl:true });
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'© OpenStreetMap' }).addTo(accomMap);
      accomMap.setView([65.0, -18.5], 5);
      hotels.forEach(h => {
        const icon = L.divIcon({
          className: '',
          html: `<div style="font-size:28px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.3));">🏠</div>`,
          iconSize:[32,32], iconAnchor:[16,16]
        });
        const nightsLabel = h.nights && h.nights.length
          ? h.nights.map(n => fmtNight(n)).join('、')
          : '入住日期待填';
        L.marker([h.lat, h.lng], {icon})
          .bindPopup(`<strong>${h.nameZh}</strong><br><span style="font-size:12px;">${h.address}</span><br><span style="font-size:12px;">入住 ${h.checkIn} · 退房 ${h.checkOut}</span><br><span style="font-size:12px;">📅 ${nightsLabel}</span>`)
          .addTo(accomMap);
      });
    }

    // ── Init ──────────────────────────────────────────────────────────
    initAuthListener(async () => {
      hotels = await loadHotels();
      renderCards();
      setTimeout(initFullMap, 100);
    });
    renderCards();
    setTimeout(initFullMap, 100);
  </script>
</body>
</html>
