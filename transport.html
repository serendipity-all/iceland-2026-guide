<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>交通票資訊 | 2026 冰島夢幻之旅</title>
  <meta name="description" content="2026 冰島行程機票、租車等交通票管理頁面。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />

  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="app.js"></script>

  <style>
    .page-hero {
      background: linear-gradient(135deg, #0d1f35 0%, #1a3050 50%, #0d2530 100%);
      padding: 80px clamp(18px,5vw,78px) 48px;
      color: white;
    }
    .page-hero h1 { font-size: clamp(28px,5vw,52px); font-weight:900; margin:0 0 8px; }
    .page-hero p { color: rgba(255,255,255,0.6); font-size:15px; margin:0; }

    .timeline-section {
      padding: 40px clamp(18px,5vw,78px) 60px;
      max-width: 880px;
    }

    .timeline { position:relative; }
    .timeline::before {
      content:'';
      position:absolute;
      left: 28px;
      top: 0; bottom: 0;
      width: 2px;
      background: var(--line);
    }

    .timeline-item {
      display: flex;
      gap: 20px;
      margin-bottom: 28px;
      position: relative;
    }

    .timeline-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
      z-index: 1;
      border: 3px solid var(--bg);
      box-shadow: 0 0 0 2px var(--line);
      color: white;
    }
    .icon-flight { background: linear-gradient(135deg, #1565c0, #42a5f5); }
    .icon-car    { background: linear-gradient(135deg, #2e7d32, #66bb6a); }

    .boarding-pass {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      transition: box-shadow 0.2s;
    }
    .boarding-pass:hover { box-shadow: 0 8px 32px rgba(0,0,0,0.08); }

    .bp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 2px dashed var(--line);
      gap: 12px;
      flex-wrap: wrap;
    }

    .bp-route {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .bp-city { font-size: 18px; font-weight: 900; letter-spacing: -0.02em; }
    .bp-arrow { color: var(--muted); font-size: 14px; }
    .bp-carrier { font-size: 13px; font-weight: 700; color: var(--muted); }

    .bp-body {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
    }
    @media (max-width: 640px) {
      .bp-body { grid-template-columns: 1fr; }
    }
    .bp-body-sub {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
      border-top: 1px solid var(--line);
      background: rgba(0,0,0,0.02);
    }
    @media (max-width: 640px) {
      .bp-body-sub { grid-template-columns: 1fr; }
    }
    .bp-field {
      padding: 12px 16px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .bp-field:last-child { border-right: none; }
    .bp-label { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: 0.06em; margin-bottom: 2px; }
    .bp-val { font-size: 14px; font-weight: 800; color: var(--ink); }
    .bp-val.pending { color: var(--muted); font-weight: 400; font-style: italic; }

    .bp-footer {
      padding: 12px 20px;
      background: var(--bg);
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Edit Form */
    .tp-edit-area {
      display: none;
      padding: 18px 20px;
      background: var(--bg);
      border-top: 1px solid var(--line);
    }
    .tp-edit-area.active { display: block; }

    .edit-form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .edit-field label {
      font-size: 10px; font-weight: 800; letter-spacing: 0.06em;
      color: var(--muted); display: block; margin-bottom: 4px; text-transform: uppercase;
    }
    .edit-field input, .edit-field textarea, .edit-field select {
      width: 100%; box-sizing: border-box; padding: 7px 10px;
      border: 1px solid var(--line); border-radius: 8px;
      background: var(--surface); color: var(--ink); font-size: 13px; font-family: inherit;
    }
    .edit-field input:focus, .edit-field textarea:focus, .edit-field select:focus { outline: none; border-color: var(--accent); }


    /* Toast */
    .save-toast {
      position: fixed; bottom: 24px; right: 24px;
      background: #1a7a5a; color: white; padding: 12px 20px;
      border-radius: 12px; font-size: 14px; font-weight: 700;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2); transform: translateY(80px);
      opacity: 0; transition: all 0.3s ease; z-index: 999;
    }
    .save-toast.show { transform: translateY(0); opacity: 1; }

    body.dark .bp-footer { background: rgba(0,0,0,0.2); }
  </style>
</head>
<body>

  <header class="topbar">
    <a class="brand" href="index.html" aria-label="回到手冊首頁">
      <span class="brand-mark">◒</span>
      <span>ICELAND · 2026</span>
    </a>
    <nav class="nav">
      <a href="index.html#today">今日模式</a>
      <a href="index.html#days">每日行程</a>
      <a href="itinerary.html">簡易行程表</a>
      <a href="accommodation.html">🏠 住宿</a>
      <a href="transport.html" style="color:var(--accent);font-weight:800;">✈️ 交通票</a>
      <a href="shopping.html">🛋️ 伴手禮</a>
      <a href="checklist.html">✅ 清單</a>
    </nav>
    <div class="topbar-actions">
      <button id="themeBtn" class="icon-btn" aria-label="切換深色模式">☾</button>
      <button id="mobileMenuBtn" class="mobile-menu-btn" aria-label="開啟選單"><i class="fa-solid fa-bars"></i> <span>選單</span></button>
    </div>
  </header>

  <div id="mobileDrawer" class="mobile-drawer">
    <nav class="mobile-drawer-nav">
      <a href="index.html#today" class="drawer-link">⚡ 今日模式 <span>↗</span></a>
      <a href="index.html#days" class="drawer-link">📅 每日行程 <span>↗</span></a>
      <a href="itinerary.html" class="drawer-link">📋 簡易行程表 <span>↗</span></a>
      <a href="accommodation.html" class="drawer-link">🏠 住宿資訊 <span>↗</span></a>
      <a href="transport.html" class="drawer-link" style="color:var(--accent);">✈️ 交通票 <span>↗</span></a>
      <a href="shopping.html" class="drawer-link">🛋️ 伴手禮清單 <span>↗</span></a>
      <a href="checklist.html" class="drawer-link">✅ 準備清單 <span>↗</span></a>
    </nav>
  </div>

  <div class="save-toast" id="saveToast">✅ 交通票資訊已儲存</div>

  <main>
    <div class="page-hero">
      <h1>✈️ 交通票 &amp; 租車資訊</h1>
      <p>航班時間 · 登機證資料 · 租車車型與取車點 — 點擊「編輯」填入細節</p>
    </div>

    <div class="timeline-section">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px;">
        <div style="font-size:14px;font-weight:700;color:var(--ink);">📋 交通行程列表</div>
        <button class="btn primary" id="addTransportBtn" style="font-size:13px;padding:8px 16px;border-radius:999px;">
          <i class="fa-solid fa-plus" style="margin-right:6px;"></i> ＋ 新增交通項目
        </button>
      </div>
      <div class="timeline" id="transport-timeline"></div>
    </div>


    <div style="padding: 0 clamp(18px,5vw,78px) 60px; display:flex; gap:12px; flex-wrap:wrap;">
      <a href="index.html" class="btn secondary" style="font-size:13px;padding:10px 20px;"><i class="fa-solid fa-arrow-left" style="margin-right:6px;"></i> 回到完整手冊</a>
      <button class="btn secondary" onclick="window.print()" style="font-size:13px;padding:10px 20px;"><i class="fa-solid fa-print" style="margin-right:6px;"></i> 列印交通資訊</button>
    </div>
  </main>

  <footer>
    <span>ICELAND 2026 · 交通票管理</span>
    <span>機票 + 租車</span>
  </footer>

  <script>
    // Theme & mobile menu
    document.getElementById('themeBtn').onclick = () => {
      document.body.classList.toggle('dark');
      document.getElementById('themeBtn').textContent = document.body.classList.contains('dark') ? '☀' : '☾';
    };
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const mobileDrawer = document.getElementById('mobileDrawer');
    if (mobileMenuBtn && mobileDrawer) {
      mobileMenuBtn.onclick = () => {
        mobileDrawer.classList.toggle('active');
        mobileMenuBtn.innerHTML = mobileDrawer.classList.contains('active')
          ? '<i class="fa-solid fa-xmark"></i> <span>關閉</span>'
          : '<i class="fa-solid fa-bars"></i> <span>選單</span>';
      };
    }

    // ── Transport Data ────────────────────────────────────────────────

    const CATEGORY_MAP = {
      flight: { name: '飛機', icon: 'fa-plane-departure', iconCls: 'icon-flight' },
      train:  { name: '火車', icon: 'fa-train', iconCls: 'icon-flight' },
      ship:   { name: '船',   icon: 'fa-ship', iconCls: 'icon-flight' },
      car:    { name: '租車', icon: 'fa-car', iconCls: 'icon-car' }
    };

    const BASE_TRANSPORTS = [
      {
        id: 'tp-flight-outbound',
        type: 'flight',
        routeFrom: 'TPE 台北',
        routeTo: 'KEF 雷克雅維克',
        startDate: '2026-09-22',
        depTime: '23:30 (TPE)',
        endDate: '2026-09-23',
        arrTime: '15:25 (KEF)',
        flightNo: 'CI-001 / FI-500',
        seat: '座位 12A',
        booking: '#TPE-KEF-2026',
        notes: '抵達後前往藍湖溫泉，再進雷克雅維克市區。'
      },
      {
        id: 'tp-car-rental',
        type: 'car',
        routeFrom: 'KEF 機場取車',
        routeTo: 'KEF 機場還車',
        startDate: '2026-09-23',
        depTime: '16:30 取車',
        endDate: '2026-10-03',
        arrTime: '12:00 還車',
        flightNo: '4WD SUV 四輪傳動車型',
        seat: '含全險 + 零自負額',
        booking: '#RENT-ICELAND-998',
        notes: '冰島車況與路況受天候影響大；確認配有防滑胎與雪鏈備用。'
      },
      {
        id: 'tp-flight-inbound',
        type: 'flight',
        routeFrom: 'KEF 雷克雅維克',
        routeTo: 'TPE 台北',
        startDate: '2026-10-03',
        depTime: '17:00 (KEF)',
        endDate: '2026-10-04',
        arrTime: '21:00 (TPE)',
        flightNo: 'FI-501 / CI-002',
        seat: '座位 14C',
        booking: '#KEF-TPE-2026',
        notes: '離境前提前 3 小時抵達 KEF 機場退稅與逛免稅店。'
      }
    ];

    function getStorageKey() {
      const uid = window.AppState && window.AppState.currentUser ? window.AppState.currentUser.uid : 'guest';
      return 'iceland_transport_data_' + uid;
    }

    function loadTransports() {
      try {
        const saved = JSON.parse(localStorage.getItem(getStorageKey()) || '[]');
        return BASE_TRANSPORTS.map(base => {
          const s = saved.find(x => x.id === base.id);
          return s ? { ...base, ...s } : { ...base };
        });
      } catch(e) { return BASE_TRANSPORTS.map(x => ({...x})); }
    }

    function saveTransports(data) {
      localStorage.setItem(getStorageKey(), JSON.stringify(data));
      const toast = document.getElementById('saveToast');
      if (toast) {
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
      }
    }

    let transports = loadTransports();

    function renderTimeline() {
      const container = document.getElementById('transport-timeline');
      container.innerHTML = '';

      transports.forEach((item, index) => {
        const catInfo = CATEGORY_MAP[item.type] || CATEGORY_MAP.flight;
        const el = document.createElement('div');
        el.className = 'timeline-item';
        el.id = 'tp-item-' + item.id;

        const depDateVal = item.startDate || '';
        const depTimeVal = item.depTime || '';
        const depDisplay = (depDateVal || depTimeVal) ? `${depDateVal} ${depTimeVal}`.trim() : '待填';

        const arrDateVal = item.endDate || '';
        const arrTimeVal = item.arrTime || '';
        const arrDisplay = (arrDateVal || arrTimeVal) ? `${arrDateVal} ${arrTimeVal}`.trim() : '待填';

        const flightNoVal = item.flightNo || '待填';

        const isFirst = index === 0;
        const isLast = index === transports.length - 1;

        el.innerHTML = `
          <div class="timeline-icon ${catInfo.iconCls}"><i class="fa-solid ${catInfo.icon}"></i></div>
          <div class="boarding-pass">
            <div class="bp-header">
              <div class="bp-route">
                <span class="bp-city">${item.routeFrom || '起站'}</span>
                <span class="bp-arrow"><i class="fa-solid fa-arrow-right"></i></span>
                <span class="bp-city">${item.routeTo || '終點'}</span>
              </div>
              <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                <span class="bp-carrier">${catInfo.name}</span>
                <div style="display:inline-flex;gap:4px;margin-left:4px;">
                  ${!isFirst ? `<button class="btn secondary" style="font-size:11px;padding:3px 8px;" onclick="moveTransport(${index}, -1)" title="向上移動"><i class="fa-solid fa-arrow-up"></i></button>` : ''}
                  ${!isLast ? `<button class="btn secondary" style="font-size:11px;padding:3px 8px;" onclick="moveTransport(${index}, 1)" title="向下移動"><i class="fa-solid fa-arrow-down"></i></button>` : ''}
                </div>
                <button class="btn primary" style="font-size:12px;padding:5px 12px;margin-left:4px;" onclick="toggleEdit('${item.id}', true)"><i class="fa-solid fa-pen"></i> 編輯</button>
              </div>
            </div>


            <!-- Top 3 Grid Cards -->
            <div class="bp-body">
              <div class="bp-field">
                <div class="bp-label">車型 / 類別</div>
                <div class="bp-val ${flightNoVal.includes('待填')?'pending':''}">${flightNoVal}</div>
              </div>
              <div class="bp-field">
                <div class="bp-label">出發 (日期 + 時間)</div>
                <div class="bp-val ${depDisplay.includes('待填')?'pending':''}">${depDisplay}</div>
              </div>
              <div class="bp-field">
                <div class="bp-label">抵達 (日期 + 時間)</div>
                <div class="bp-val ${arrDisplay.includes('待填')?'pending':''}">${arrDisplay}</div>
              </div>
            </div>

            <!-- Sub Grid Details -->
            <div class="bp-body-sub">
              <div class="bp-field">
                <div class="bp-label">座位 / 保險</div>
                <div class="bp-val ${(item.seat||'').includes('待填')?'pending':''}">${item.seat || '待填'}</div>
              </div>
              <div class="bp-field">
                <div class="bp-label">訂單號 / PNR</div>
                <div class="bp-val ${(item.booking||'').includes('待填')?'pending':''}">${item.booking || '待填'}</div>
              </div>
              <div class="bp-field">
                <div class="bp-label">備註</div>
                <div class="bp-val ${(item.notes||'').includes('待填')?'pending':''}">${item.notes || '無備註'}</div>
              </div>
            </div>

            <!-- Edit Area -->
            <div class="tp-edit-area" id="edit-area-${item.id}">
              <div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:12px;">⚙️ 交通資訊編輯設定</div>
              <div class="edit-form-grid">
                <div class="edit-field" style="grid-column:1/-1;">
                  <label>類別 (用於圖示顯示)</label>
                  <select id="ef-type-${item.id}">
                    <option value="flight" ${item.type==='flight'?'selected':''}>✈️ 飛機</option>
                    <option value="train"  ${item.type==='train'?'selected':''}>🚆 火車</option>
                    <option value="ship"   ${item.type==='ship'?'selected':''}>🛳️ 船</option>
                    <option value="car"    ${item.type==='car'?'selected':''}>🚗 租車</option>
                  </select>
                </div>

                <div class="edit-field"><label>起站</label><input type="text" id="ef-from-${item.id}" value="${item.routeFrom || ''}"></div>
                <div class="edit-field"><label>出發日期</label><input type="date" id="ef-startdate-${item.id}" value="${item.startDate || ''}"></div>
                <div class="edit-field"><label>出發時間</label><input type="text" id="ef-deptime-${item.id}" value="${item.depTime || ''}" placeholder="例如 23:30 (TPE)"></div>

                <div class="edit-field"><label>中站 / 抵達點</label><input type="text" id="ef-to-${item.id}" value="${item.routeTo || ''}"></div>
                <div class="edit-field"><label>抵達日期</label><input type="date" id="ef-enddate-${item.id}" value="${item.endDate || ''}"></div>
                <div class="edit-field"><label>抵達時間</label><input type="text" id="ef-arrtime-${item.id}" value="${item.arrTime || ''}" placeholder="例如 15:25 (KEF)"></div>

                <div class="edit-field"><label>航班號 / 車型</label><input type="text" id="ef-flightno-${item.id}" value="${item.flightNo || ''}"></div>
                <div class="edit-field"><label>座位 / 保險</label><input type="text" id="ef-seat-${item.id}" value="${item.seat || ''}"></div>
                <div class="edit-field" style="grid-column:1/-1;"><label>訂單號</label><input type="text" id="ef-booking-${item.id}" value="${item.booking || ''}"></div>
                <div class="edit-field" style="grid-column:1/-1;"><label>備註</label><textarea id="ef-notes-${item.id}">${item.notes || ''}</textarea></div>
              </div>
              <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap;gap:8px;">
                <div style="display:flex;gap:8px;">
                  <button class="btn primary" style="font-size:12px;padding:6px 14px;" onclick="saveEdit('${item.id}')"><i class="fa-solid fa-check"></i> 儲存</button>
                  <button class="btn secondary" style="font-size:12px;padding:6px 14px;" onclick="toggleEdit('${item.id}', false)">取消</button>
                </div>
                <button class="btn secondary" style="font-size:12px;padding:6px 14px;color:#e74c3c;border-color:#e74c3c;" onclick="deleteTransport('${item.id}')">
                  <i class="fa-solid fa-trash"></i> 刪除此交通
                </button>
              </div>
            </div>
          </div>
        `;
        container.appendChild(el);
      });
    }

    function toggleEdit(id, show) {
      const area = document.getElementById('edit-area-' + id);
      if (area) area.classList.toggle('active', show);
    }

    function saveEdit(id) {
      const item = transports.find(x => x.id === id);
      if (!item) return;
      item.type      = document.getElementById('ef-type-' + id).value;
      item.routeFrom = document.getElementById('ef-from-' + id).value.trim();
      item.startDate = document.getElementById('ef-startdate-' + id).value.trim();
      item.depTime   = document.getElementById('ef-deptime-' + id).value.trim();
      item.routeTo   = document.getElementById('ef-to-' + id).value.trim();
      item.endDate   = document.getElementById('ef-enddate-' + id).value.trim();
      item.arrTime   = document.getElementById('ef-arrtime-' + id).value.trim();
      item.flightNo  = document.getElementById('ef-flightno-' + id).value.trim();
      item.seat      = document.getElementById('ef-seat-' + id).value.trim();
      item.booking   = document.getElementById('ef-booking-' + id).value.trim();
      item.notes     = document.getElementById('ef-notes-' + id).value.trim();

      saveTransports(transports);
      renderTimeline();
    }

    function moveTransport(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= transports.length) return;
      const temp = transports[index];
      transports[index] = transports[targetIndex];
      transports[targetIndex] = temp;
      saveTransports(transports);
      renderTimeline();
    }

    function deleteTransport(id) {

      if (confirm('確定要刪除此筆交通行程嗎？')) {
        transports = transports.filter(x => x.id !== id);
        saveTransports(transports);
        renderTimeline();
      }
    }

    function addTransport() {
      const newId = 'tp-' + Date.now();
      const newTransport = {
        id: newId,
        type: 'flight',
        routeFrom: '新起站',
        routeTo: '新目的地',
        startDate: '',
        depTime: '',
        endDate: '',
        arrTime: '',
        flightNo: '新航班 / 車型',
        seat: '',
        booking: '',
        notes: ''
      };
      transports.push(newTransport);
      saveTransports(transports);
      renderTimeline();
      toggleEdit(newId, true);
      const newEl = document.getElementById('tp-item-' + newId);
      if (newEl) newEl.scrollIntoView({ behavior: 'smooth' });
    }

    // Init
    const addBtn = document.getElementById('addTransportBtn');
    if (addBtn) addBtn.onclick = addTransport;

    initAuthListener(() => {
      transports = loadTransports();
      renderTimeline();
    });
    renderTimeline();

  </script>
</body>
</html>
